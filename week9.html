<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 7 | Complete Book Search</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f19;
      --surface: #151d30;
      --surface-hover: #1e2942;
      --border: #233354;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #818cf8;
      --danger: #f43f5e;
      --warning: #fbbf24;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.55);
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Breadcrumbs */
    .crumbbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .crumbbar a {
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }

    .crumbbar a:hover {
      color: var(--primary);
    }

    .crumbbar .back {
      background: var(--surface);
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .crumbbar .back:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
    }

    /* Hero Header */
    .hero {
      text-align: center;
      padding: 2.75rem 1.5rem 1.25rem;
    }

    .hero h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .panel {
      background: rgba(21, 29, 48, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow);
    }

    .panel-header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .panel-header h2 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.85rem;
      margin-bottom: 0.4rem;
    }

    .panel-header p {
      color: var(--text-muted);
    }

    /* Search Controls */
    .search-box-wrapper {
      max-width: 640px;
      margin: 0 auto 1.5rem;
    }

    .search-form {
      display: flex;
      gap: 0.75rem;
    }

    .input-field {
      flex: 1;
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .input-field.input-error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .search-button {
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: #0b0f19;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition);
      white-space: nowrap;
      min-width: 140px;
    }

    .search-button:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .search-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
      transition: var(--transition);
    }

    .hint.is-error {
      color: var(--danger);
      font-weight: 500;
    }

    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .results-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .results-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Book Cards Grid */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .book {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      position: relative;
    }

    .book:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.6);
    }

    .cover-container {
      width: 100%;
      height: 270px;
      background: #0d1424;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .book .cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .book:hover .cover {
      transform: scale(1.04);
    }

    .cover-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 1.5rem;
      text-align: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #101827 0%, #172138 100%);
    }

    .cover-placeholder span {
      font-size: 2.5rem;
    }

    .book-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .book-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.45rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-author {
      font-size: 0.875rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }

    .tag-badge {
      font-size: 0.7rem;
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 100%;
      overflow: hidden;
    }

    .book-details {
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      color: #64748b;
    }

    .detail-value {
      color: var(--text);
      font-weight: 500;
    }

    .book-link {
      display: inline-block;
      margin-top: 0.85rem;
      text-align: center;
      padding: 0.45rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      border: 1px solid var(--border);
      background: rgba(56, 189, 248, 0.05);
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: var(--transition);
    }

    .book-link:hover {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
    }

    /* Status Components */
    .status-panel {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .status-panel .icon {
      font-size: 2.5rem;
    }

    .status-panel.error-state {
      color: #fda4af;
    }

    .status-panel.error-state p {
      color: var(--text-muted);
      max-width: 440px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    @media (max-width: 600px) {
      .panel { padding: 1.25rem; }
      .search-form { flex-direction: column; }
      .search-button { width: 100%; }
      .hero h1 { font-size: 2.1rem; }
    }
  </style>
</head>

<body>

<div class="crumbbar">
  <div>
    <a href="../index.html">Web Programming</a> &nbsp; / &nbsp;
    <a href="index.html">Week 7</a>
  </div>
  <a class="back" href="index.html">Back</a>
</div>

<header class="hero">
  <p>The complete Book Search experience.</p>
</header>

<main>
  <div class="panel">

    <div class="panel-header">
      <h2>📚 Book Search</h2>
      <p>Discover books by title using the Open Library Search API.</p>
    </div>

    <div class="search-box-wrapper">
      <form class="search-form" id="searchForm" novalidate>
        <input
          id="query"
          class="input-field"
          type="search"
          placeholder="Search books by title, author, or keyword…"
          aria-label="Book title"
          aria-describedby="hint"
          autocomplete="off"
        >

        <button id="searchButton" class="search-button" type="submit">
          Search
        </button>
      </form>

      <p class="hint" id="hint">Search for your favorite books!</p>
    </div>

    <div class="results-header">
      <h2 class="results-title">Results</h2>
      <span class="results-meta" id="resultsMeta"></span>
    </div>

    <div class="results" id="results" aria-live="polite">
      <div class="status-panel">
        <span class="icon">🔍</span>
        <p class="status">Enter a book title to get started.</p>
      </div>
    </div>

  </div>
</main>

<footer>Created by Pandey Aayush | Student ID: 202537201</footer>

<script>
  const searchForm = document.getElementById('searchForm');
  const queryInput = document.getElementById('query');
  const button = document.getElementById('searchButton');
  const hint = document.getElementById('hint');
  const results = document.getElementById('results');
  const resultsMeta = document.getElementById('resultsMeta');

  let activeController = null;

  // Real-time input validation feedback
  queryInput.addEventListener('input', () => {
    const val = queryInput.value.trim();

    if (!val) {
      setHint('Search for your favorite books!');
      queryInput.classList.remove('input-error');
      queryInput.removeAttribute('aria-invalid');

    } else if (val.length < 2) {
      setHint('Keep typing... titles need at least 2 characters', false);

    } else {
      setHint('Press Enter or click Search', false);
      queryInput.classList.remove('input-error');
      queryInput.removeAttribute('aria-invalid');
    }
  });

  searchForm.addEventListener('submit', event => {
    event.preventDefault();
    searchBooks();
  });

  async function searchBooks() {
    const query = queryInput.value.trim();
    results.replaceChildren();

    // Input Validation
    if (query.length < 2) {
      queryInput.classList.add('input-error');
      queryInput.setAttribute('aria-invalid', 'true');

      setHint('Please type at least 2 characters.', true);
      resultsMeta.textContent = '';

      results.innerHTML = `
        <div class="status-panel">
          <span class="icon">✏️</span>
          <p class="status">
            Enter a book title to get started (at least 2 characters).
          </p>
        </div>
      `;

      queryInput.focus();
      return;
    }

    queryInput.classList.remove('input-error');
    queryInput.removeAttribute('aria-invalid');

    setHint('Searching Open Library...', false);

    // Cancel in-flight requests
    if (activeController) {
      activeController.abort();
    }

    activeController = new AbortController();

    // Loading State
    button.disabled = true;
    button.textContent = 'Searching…';

    resultsMeta.textContent = 'Searching Open Library…';

    results.innerHTML = `
      <div class="status-panel">
        <div class="spinner"></div>
        <p class="status">
          Loading books for "<strong>${escapeHtml(query)}</strong>"…
        </p>
      </div>
    `;

    try {
      const response = await fetch(
        'https://openlibrary.org/search.json?title=' +
        encodeURIComponent(query) + '&limit=12',
        { signal: activeController.signal }
      );

      if (!response.ok) {
        throw new Error(
          'Request failed with HTTP status ' + response.status
        );
      }

      const data = await response.json();

      results.replaceChildren();

      const docs = data.docs || [];

      // Empty Results State
      if (!docs.length) {
        resultsMeta.textContent = '0 matches found';

        setHint('No books found. Try a different title.', false);

        results.innerHTML = `
          <div class="status-panel">
            <span class="icon">📖</span>
            <p class="status">
              No books found. Try a different title.
            </p>
          </div>
        `;

        return;
      }

      setHint(`Found ${docs.length} books`, false);

      resultsMeta.textContent =
        `Showing ${docs.length} of ${data.numFound.toLocaleString()} results`;

      const grid = document.createElement('div');
      grid.className = 'results-grid';

      docs.forEach(book => {
        const item = document.createElement('article');
        item.className = 'book';

        const titleText = book.title || 'Untitled';

        const authorsList = book.author_name || ['Not listed'];

        const displayedAuthors = authorsList.slice(0, 3).join(', ');

        const extraAuthors = authorsList.length > 3
          ? ` (+${authorsList.length - 3} more)`
          : '';

        const authorText = displayedAuthors + extraAuthors;

        const publishYearText = book.first_publish_year
          ? String(book.first_publish_year)
          : 'Year not listed';

        const editionsText = book.edition_count
          ? String(book.edition_count)
          : 'Not listed';

        // Cover setup with fallback
        const coverBox = document.createElement('div');
        coverBox.className = 'cover-container';

        if (book.cover_i) {
          const img = document.createElement('img');

          img.className = 'cover';

          img.src =
            'https://covers.openlibrary.org/b/id/' +
            book.cover_i + '-M.jpg';

          img.alt = 'Cover of ' + titleText;
          img.loading = 'lazy';

          img.onerror = () => {
            img.remove();
            coverBox.appendChild(createCoverPlaceholder());
          };

          coverBox.appendChild(img);

        } else {
          coverBox.appendChild(createCoverPlaceholder());
        }

        // Details Container
        const text = document.createElement('div');
        text.className = 'book-content';

        const h = document.createElement('h3');
        h.className = 'book-title';
        h.textContent = titleText;
        h.title = titleText;

        const author = document.createElement('p');
        author.className = 'book-author';
        author.textContent = 'Author(s): ' + authorText;
        author.title = authorText;

        // Subject tags (up to 2)
        const tagsWrapper = document.createElement('div');
        tagsWrapper.className = 'book-tags';

        const subjects = (book.subject || []).slice(0, 2);

        subjects.forEach(sub => {
          const badge = document.createElement('span');

          badge.className = 'tag-badge';
          badge.textContent = sub;

          tagsWrapper.appendChild(badge);
        });

        // Metadata grid
        const details = document.createElement('div');
        details.className = 'book-details';

        details.innerHTML = `
          <div class="detail-row">
            <span class="detail-label">First published</span>
            <span class="detail-value">
              ${escapeHtml(publishYearText)}
            </span>
          </div>

          <div class="detail-row">
            <span class="detail-label">Editions</span>
            <span class="detail-value">
              ${escapeHtml(editionsText)}
            </span>
          </div>
        `;

        // Direct link to Open Library book work
        const openLibraryKey = book.key
          ? `https://openlibrary.org${book.key}`
          : `https://openlibrary.org/search?q=${encodeURIComponent(titleText)}`;

        const link = document.createElement('a');

        link.className = 'book-link';
        link.href = openLibraryKey;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'View on Open Library ↗';

        text.append(h, author);

        if (subjects.length > 0) {
          text.append(tagsWrapper);
        }

        text.append(details, link);

        item.append(coverBox, text);

        grid.appendChild(item);
      });

      results.appendChild(grid);

    } catch (e) {
      if (e.name === 'AbortError') return;

      console.error(e);

      setHint('Connection error', true);

      resultsMeta.textContent = '';

      results.innerHTML = `
        <div class="status-panel error-state">
          <span class="icon">⚠️</span>
          <h3>Search Failed</h3>
          <p class="status">
            Could not load books. Please check your internet connection and try again.
          </p>
        </div>
      `;

    } finally {
      button.disabled = false;
      button.textContent = 'Search';
    }
  }

  function createCoverPlaceholder() {
    const placeholder = document.createElement('div');

    placeholder.className = 'cover-placeholder';

    placeholder.innerHTML = `
      <span>📘</span>
      <div>No Cover Available</div>
    `;

    return placeholder;
  }

  function setHint(message, isError = false) {
    hint.textContent = message;

    if (isError) {
      hint.classList.add('is-error');
    } else {
      hint.classList.remove('is-error');
    }
  }

  function escapeHtml(str) {
    if (!str) return '';

    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>

</body>
</html>
